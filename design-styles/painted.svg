<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="paint-title paint-desc">
  <title id="paint-title">The Little Living World — illustrated aquarium</title>
  <desc id="paint-desc">A cozy, hand-drawn freshwater aquarium on a honey-colored wooden stand. Each purchased upgrade is a tangible object: plants, a black sponge filter, heater, planted light, mesh nursery, feeder, water probe, and automated dosing equipment.</desc>
